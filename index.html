<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commit Message Generator</title>
  <meta name="description" content="AI-powered commit message generator with Conventional Commits support. Generate clear, consistent commit messages instantly with AI.">
  <meta property="og:title" content="Commit Message Generator">
  <meta property="og:description" content="AI-powered commit message generator with Conventional Commits support. Generate clear, consistent commit messages instantly with AI.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://commit-message-generator.vercel.app">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Commit Message Generator">
  <meta name="twitter:description" content="AI-powered commit message generator with Conventional Commits support.">
  <link rel="canonical" href="https://commit-message-generator.vercel.app">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0D1117;
      --surface: #161B22;
      --border: #30363D;
      --accent: #58A6FF;
      --accent-hover: #79B8FF;
      --text: #F0F6FC;
      --text-muted: #8B949E;
      --success: #3FB950;
      --error: #F85149;
    }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
    }
    .header-icon {
      width: 24px; height: 24px;
      color: var(--accent);
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      padding: 0;
    }
    .panel {
      display: flex;
      flex-direction: column;
      padding: 20px;
      border-right: 1px solid var(--border);
    }
    .panel:last-child { border-right: none; }
    .panel-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }
    textarea {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 12px;
      resize: none;
      min-height: 300px;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    textarea::placeholder { color: var(--text-muted); }
    .output-area {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      min-height: 300px;
      overflow-y: auto;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .output-area.empty {
      color: var(--text-muted);
      font-style: italic;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .control-group label {
      font-size: 12px;
      color: var(--text-muted);
    }
    select, input[type="password"], input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      padding: 6px 10px;
    }
    select:focus, input:focus { outline: none; border-color: var(--accent); }
    input[type="password"] { width: 180px; }
    input[type="text"] { width: 140px; }
    .btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--border); }
    .btn-group {
      display: flex;
      gap: 6px;
    }
    .btn-group button {
      background: var(--bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 5px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-group button.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    .btn-group button:hover:not(.active) {
      background: var(--border);
      color: var(--text);
    }
    .api-key-section {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .api-key-section label { font-size: 11px; color: var(--text-muted); }
    #apiKey { width: 140px; }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--success);
      color: var(--bg);
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    .toast.error {
      background: var(--error);
      color: var(--text);
    }
    .error-msg {
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid var(--error);
      border-radius: 4px;
      color: var(--error);
      font-size: 11px;
      padding: 8px 12px;
      margin-top: 8px;
      display: none;
    }
    .error-msg.show { display: block; }
    .loading {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--text-muted);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; }
      .panel { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="4"/>
      <path d="M16 8l2-2m-4 4l2-2M8 16l-2 2m4-4l-2 2"/>
    </svg>
    <h1>Commit Message Generator</h1>
  </header>

  <main>
    <div class="panel">
      <div class="panel-label">Git Diff Input</div>
      <textarea id="diffInput" placeholder="Paste your git diff here...

Example:
diff --git a/src/utils.js b/src/utils.js
--- a/src/utils.js
+++ b/src/utils.js
@@ -1,5 +1,7 @@
 const greet = (name) => {
+  // Added personalization
   return `Hello, ${name}!`;
 };</textarea>
    </div>

    <div class="panel">
      <div class="panel-label">Generated Commit Message</div>
      <div id="output" class="output-area empty">AI-generated commit message will appear here...</div>
      <div id="errorMsg" class="error-msg"></div>
    </div>
  </main>

  <div class="controls">
    <div class="control-row">
      <div class="control-group">
        <label>Type:</label>
        <select id="commitType">
          <option value="auto">auto-detect</option>
          <option value="feat">feat</option>
          <option value="fix">fix</option>
          <option value="docs">docs</option>
          <option value="style">style</option>
          <option value="refactor">refactor</option>
          <option value="test">test</option>
          <option value="chore">chore</option>
          <option value="perf">perf</option>
          <option value="ci">ci</option>
          <option value="build">build</option>
        </select>
      </div>

      <div class="control-group">
        <label>Format:</label>
        <div class="btn-group">
          <button class="active" data-format="conventional">conventional</button>
          <button data-format="emoji">emoji</button>
          <button data-format="concise">concise</button>
        </div>
      </div>

      <div class="api-key-section">
        <label>API Key:</label>
        <input type="password" id="apiKey" placeholder="sk-ant-...">
      </div>

      <button id="generateBtn" class="btn">Generate</button>
      <button id="copyBtn" class="btn btn-secondary">Copy</button>
    </div>
  </div>

  <div id="toast" class="toast">Copied to clipboard!</div>

  <script>
    const diffInput = document.getElementById('diffInput');
    const output = document.getElementById('output');
    const errorMsg = document.getElementById('errorMsg');
    const apiKeyInput = document.getElementById('apiKey');
    const commitType = document.getElementById('commitType');
    const generateBtn = document.getElementById('generateBtn');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');
    const formatBtns = document.querySelectorAll('.btn-group button');

    let currentFormat = 'conventional';
    let generatedMessage = '';

    // Load API key from localStorage
    apiKeyInput.value = localStorage.getItem('cmg_api_key') || '';

    // Save API key on change
    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('cmg_api_key', apiKeyInput.value);
    });

    // Format buttons
    formatBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        formatBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFormat = btn.dataset.format;
      });
    });

    // Generate
    generateBtn.addEventListener('click', generateCommit);
    diffInput.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') generateCommit();
    });

    async function generateCommit() {
      const diffText = diffInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!diffText) {
        showError('Please paste a git diff first.');
        return;
      }
      if (!apiKey) {
        showError('Please enter your Anthropic API key.');
        return;
      }

      hideError();
      generateBtn.disabled = true;
      generateBtn.innerHTML = '<span class="loading"></span>Generating...';
      output.classList.add('empty');
      output.textContent = 'Analyzing diff...';
      generatedMessage = '';

      const typeOverride = commitType.value !== 'auto' ? commitType.value : null;

      const formatInstruction = {
        conventional: 'Respond ONLY with the commit message in this format: type(scope): description',
        emoji: 'Respond ONLY with the commit message with emoji prefix, format: :type: type(scope): description',
        concise: 'Respond ONLY with a one-line concise commit message, no prefix needed'
      };

      const typeList = 'Types: feat, fix, docs, style, refactor, test, chore, perf, ci, build';
      const typeInstruction = typeOverride
        ? `Force the type to be: ${typeOverride}`
        : `If there are multiple meaningful changes, pick the most important one. ${typeList}`;

      const prompt = `Analyze this git diff and generate a commit message.

${diffText}

${typeInstruction}
${formatInstruction[currentFormat]}
Keep descriptions concise (under 72 chars). If there are multiple files, detect the scope from file paths.`;

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json'
          },
          body: JSON.stringify({
            model: 'claude-3-5-haiku-20241022',
            max_tokens: 200,
            messages: [{
              role: 'user',
              content: prompt
            }]
          })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error?.message || `API error ${response.status}`);
        }

        const data = await response.json();
        const message = data.content?.[0]?.text?.trim();

        if (!message) throw new Error('Empty response from API');

        generatedMessage = message;
        output.classList.remove('empty');
        output.textContent = message;

      } catch (err) {
        showError(err.message || 'Failed to generate commit message');
        output.textContent = '';
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Generate';
      }
    }

    // Copy
    copyBtn.addEventListener('click', () => {
      if (!generatedMessage) {
        showToast('No message to copy', true);
        return;
      }
      navigator.clipboard.writeText(generatedMessage).then(() => {
        showToast('Copied to clipboard!');
      }).catch(() => {
        showToast('Failed to copy', true);
      });
    });

    function showToast(msg, isError = false) {
      toast.textContent = msg;
      toast.classList.toggle('error', isError);
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('show');
    }

    function hideError() {
      errorMsg.classList.remove('show');
    }
  </script>
</body>
</html>
